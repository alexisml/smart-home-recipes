# ==========================================================================
# Example: control WiZ bulbs from an ESP8266 relay device over local UDP
#
# A minimal device: the bulb list in a text entity, a count of bulbs online,
# and "all off" / "all on" buttons that send to every bulb at once and then
# verify for 3 s, logging any bulb that didn't confirm.
#
# Full docs: https://github.com/alexisml/smart-home-recipes/tree/main/esphome/components/wiz_udp
# ==========================================================================

substitutions:
  name: my-relay
  friendly_name: My Relay

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

external_components:
  - source: github://alexisml/smart-home-recipes@main
    components: [wiz_udp]
    refresh: 1d

# Reads bulb answers and keeps the bulb list in sync with the text entity.
wiz_udp:
  bulbs: wiz_ips

text:
  - platform: template
    name: "WiZ bulbs"
    id: wiz_ips
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    max_length: 120
    initial_value: "192.168.1.50,192.168.1.51"

interval:
  # Ask every bulb for its state every 3 s (answers are read by the component).
  - interval: 3s
    then:
      - lambda: 'wiz_udp::get_pilot_all();'

sensor:
  - platform: template
    name: "WiZ bulbs online"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return wiz_udp::online_count(10000);'

script:
  # Send a target to all bulbs at once, then verify every 250 ms for 3 s.
  - id: wiz_send
    parameters:
      turn_on: bool
    mode: restart
    then:
      - lambda: |-
          auto t = turn_on ? wiz_udp::target_on(1.0f, false, 1, 1, 1, 370) : wiz_udp::target_off();
          wiz_udp::begin_command(t, 3000);
      - delay: 150ms
      - while:
          condition:
            lambda: 'return wiz_udp::command_step();'
          then:
            - delay: 250ms
      - lambda: |-
          if (wiz_udp::command_confirmed())
            ESP_LOGI("wiz", "all bulbs confirmed");
          else
            ESP_LOGW("wiz", "not confirmed: %s", wiz_udp::command_unconfirmed().c_str());

button:
  - platform: template
    name: "WiZ all off"
    on_press:
      - script.execute:
          id: wiz_send
          turn_on: false
  - platform: template
    name: "WiZ all on"
    on_press:
      - script.execute:
          id: wiz_send
          turn_on: true
