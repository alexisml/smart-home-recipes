# ==========================================================================
# Example: resilience on any ESPHome device
#
# HOW TO USE
#
# This package goes on top of a device config you already have. Don't
# replace your config with this file; copy the parts marked below into it.
#
# 1. Open your device's YAML in the ESPHome dashboard.
# 2. Add the two REQUIRED substitutions below to your `substitutions:`.
#    Without them validation stops and names the missing one.
# 3. Add the `packages:` block (or the `resilience:` entry to your existing
#    `packages:`).
# 4. Remove anything in your config the package now covers, if it's
#    there: `captive_portal:`, a `wifi: ap:` block, `api: reboot_timeout`,
#    and any `time:` platforms (keeping yours gives you a second clock with
#    a different id; harmless, but pointless).
# 5. Optional: the board-specific settings in the README (persist settings
#    across power cuts, a web UI usable while HA is down).
# 6. INSTALL -> Wirelessly.
#
# Full docs: https://github.com/alexisml/smart-home-recipes/tree/main/esphome/common/resilience
# ==========================================================================

substitutions:
  name: my-device
  friendly_name: My Device

  # REQUIRED. IANA timezone name:
  # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  resilience_timezone: America/Montevideo
  # REQUIRED. Password of the fallback hotspot.
  resilience_ap_password: !secret wifi_password

  # Optional: how long without Home Assistant before rebooting.
  # resilience_api_reboot_timeout: 24h

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m
  # Optional but recommended, see the README: settings survive power cuts.
  restore_from_flash: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

packages:
  resilience:
    url: https://github.com/alexisml/smart-home-recipes
    ref: main
    files: [esphome/common/resilience/resilience.yaml]
    refresh: 1d
